version: "3"

vars:
  STANDARDS_URL: https://github.com/michaelolof/golang-service-standards.git

includes:
  standards:
    taskfile: .standards/Taskfile.standards.yml
    dir: .
    flatten: true

tasks:
  test:       {desc: Unit and handler tests. No infrastructure, cmds: [go test -race ./...]}
  build:      {desc: Build everything, cmds: [go build ./...]}

  # The test stack, and one task per tagged kind of test. Each task runs only its
  # own kind (TEST-1, TEST-3, TEST-17).
  test:up:
    desc: Start the test stack, if it isn't running
    cmds: [docker compose -f docker-compose.test.yml --env-file .env.test up -d --wait]
  test:down:
    desc: Stop the test stack and remove its data. task test:all runs it first
    cmds: [docker compose -f docker-compose.test.yml --env-file .env.test down -v --remove-orphans]
  test:integration:
    desc: Integration tests against the test stack, without the flows. Only the packages that have them run. Pass packages after --, or run them all
    dotenv: [.env.test]
    deps: [test:up]
    vars:
      PACKAGES: {sh: go run -C .standards/tools/testpackages . -tags integration "$PWD"}
    cmds:
      - go test -tags integration -race -count=1 -shuffle=on {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.PACKAGES}}{{end}}
  test:flows:
    desc: Flows against the test stack, on their own. Pass packages after --, or run them all
    dotenv: [.env.test]
    deps: [test:up]
    cmds:
      - go test -tags flow -race -count=1 -shuffle=on {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./test/flows/...{{end}}
  test:all:
    desc: Unit tests, then integration tests, then flows, on a fresh test stack
    cmds:
      - task: test
      - task: test:down
      - task: test:integration
      - task: test:flows
  test:build:
    desc: Compile every tagged test without running it, so a change can't break one unseen
    cmds:
      # A list in brackets would split the tags at each comma, so this one is on its own line.
      - go vet -tags integration,flow,contract,perf ./...
  test:contract:
    desc: Contract tests against the vendors' sandboxes, by hand, with their credentials. Never in CI
    cmds: [go test -tags contract -count=1 -v ./test/contract/...]

  vuln:       {desc: Known vulnerabilities in the code, cmds: [go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...]}
  check:fast: {desc: What the hooks run (the standard's local checks and unit tests), deps: [standards:check:fast, test]}
  check:      {desc: CI gate (read-only), deps: [standards:check, test, test:build, build, vuln]}
