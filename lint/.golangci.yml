# Shared golangci-lint config for Go services.
# Validated on golangci-lint v2.15.0. It needs the custom binary that has the standard's plugins compiled in:
# requiredtag, wrapgaps, and the analyzers in lint/analyzers, which hold the structural checks (TEST-13).
# In a project, `task lint` builds that binary and runs it (10-adoption.md, ADO-1).
#
# Rule IDs in comments (LAY-, DOM-, ABS-, ERR-, HTTP-, CTX-, CON-, LOG-, OBS-, DATA-, TEST-, STY-)
# point to the standard's documents.
#
# Don't edit this file in a project. `task lint:config` writes .golangci.yml from it, with the project's module path filled in.
version: "2"

run:
  timeout: 10m
  relative-path-mode: gomod # exclusion paths below are module-relative
  tests: false # restructuring tests is paused, so test files aren't linted (TEST-14)
  build-tags: [integration] # integration tests must still compile (TEST-1)
  # No run.go: go.mod's `go` line decides.

linters:
  default: none
  enable:
    # correctness baseline
    - govet
    - staticcheck # SA bugs; ST1000 package docs, ST1003 initialisms, ST1016 receivers
    - errcheck
    - ineffassign
    - unused
    # style, naming, shape (STY-*)
    - revive
    - gocritic
    - gocognit
    - wsl_v5 # STY-9 paragraphs; auto-fixable with --fix
    - requiredtag # STY-3 required fields, marked per field with a struct tag (the standard's plugin)
    - funcorder
    - embeddedstructfieldcheck
    - modernize
    - intrange
    - copyloopvar
    - usestdlibvars
    - musttag
    - tagliatelle
    - nolintlint
    - gochecknoinits
    - reassign
    # errors (ERR-*)
    - errorlint
    - wrapcheck
    - wrapgaps # ERR-3 the returns wrapcheck skips (the standard's plugin)
    - nilerr
    - nilnil
    - errname
    # interfaces (ABS-*)
    - iface
    - ireturn
    - interfacebloat
    # context, IO, security (CTX-*, DATA-5)
    - containedctx
    - contextcheck
    - noctx
    - bodyclose
    - gosec
    # policy
    - forbidigo
    - depguard
    # structure: the standard's own analyzers, in lint/analyzers (TEST-13)
    - layers
    - cmdshape
    - names
    - enums
    - services
    - adapters
    - generics
    - errkinds
    - gofihandlers
    - errmap
    - jobs
    - ctxkeys
    - goroutines
    - repos
    - repoverbs
    - constquery
    - comments
    - metricnames
    # tests (TEST-*)
    - testifylint
    - thelper
    - usetesting
    - testpackage

  settings:
    govet:
      enable-all: true
      disable: [fieldalignment, shadow] # layout churn; shadowing `err` is idiomatic

    staticcheck:
      checks: ["all", "-ST1020", "-ST1021", "-ST1022", "-QF1008"]
      # The default list is spelled out because v2.15 panics on staticcheck's "inherit" token.
      initialisms: [ACL, API, ASCII, CPU, CSS, DNS, EOF, GUID, HTML, HTTP, HTTPS,
        ID, IP, JSON, QPS, RAM, RPC, SLA, SMTP, SQL, SSH, TCP, TLS, TTL, UDP, UI,
        GID, UID, UUID, URI, URL, UTF8, VM, XML, XMPP, XSRF, XSS, SIP, RTP, AMQP,
        DB, TS, AWS, CQL, DEK, DLQ, EVM, HMAC, JWT, KMS, KYC, MFA, OTP, PII, SDK,
        SHA, ULID]

    errcheck:
      check-type-assertions: true

    revive:
      enable-default-rules: false
      rules:
        # naming (LAY-8, STY-2)
        - name: var-naming
          arguments: [[], [ULID, KMS, DEK, JWT, KYC, OTP, SDK, DLQ, HMAC, PII, MFA, EVM]]
        - name: package-naming
          arguments:
            # The names analyzer reports any other name ending in util(s) or helper(s) (LAY-9).
            - userDefinedBadNames: [helper, helpers, shared, base, models, model]
        - name: package-directory-mismatch
        - name: filename-format
          arguments: ["^[a-z0-9]+(_[a-z0-9]+)*\\.go$"]
        - {name: receiver-naming, arguments: [{maxLength: 2}]} # STY-2: 1-2 letters from the type
        - name: error-naming
        - name: error-strings
        - name: time-naming
        - name: redefines-builtin-id
        - name: import-alias-naming
        - name: redundant-import-alias
        - name: dot-imports
        - name: blank-imports
        - name: exported # doc comments + stutter
        - name: package-comments # LAY-11
        # shape (STY-3)
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
        - {name: max-control-nesting, arguments: [4]}
        - {name: argument-limit, arguments: [6]}
        - {name: function-result-limit, arguments: [3]}
        - name: bare-return
        - name: deep-exit # LAY-2
        - name: unexported-return
        - name: context-as-argument
        - name: context-keys-type
        - name: file-length-limit # LAY-10
          arguments: [{max: 1000, skipComments: true, skipBlankLines: true}]
        # modern / misc (STY-7)
        - name: use-any
        - name: var-declaration
        - name: increment-decrement
        - name: comment-spacings
        - name: unnecessary-format
        - name: use-errors-new

    gocritic:
      # The default stable set stays on; it includes exitAfterDefer (LAY-2).
      enabled-checks:
        - commentedOutCode
        - docStub # the comments analyzer checks TODOs (STY-5)
        - deferInLoop
        - sloppyReassign
        - unnamedResult
        - emptyStringTest
        - httpNoBody
        - nestingReduce
        - typeAssertChain
      settings:
        unnamedResult: {checkExported: true}

    # STY-3: no length limit. Complexity and nesting measure how hard a function is to follow.
    gocognit: {min-complexity: 20}
    wsl_v5: # STY-9: default checks, plus a blank line after every closing brace
      enable: [after-block]

    wrapcheck: # ERR-3. Written before custom, because wrapgaps reuses these two lists.
      # gofi MDW-6 and HTTP-3: the error from c.Next() and c.Send() goes back unchanged.
      # Send has no closing parenthesis, so it also covers SendString, SendBytes and SendStream.
      extra-ignore-sigs: &wrap-ignore-sigs [errx.New(, errx.Newf(, errx.NewKind(, errx.NewKindf(,
        errx.Wrap(, errx.WrapKind(, httperr., gofi.Context).Next(, gofi.Context).Send]
      ignore-package-globs: &wrap-ignore-packages ["*/internal/http/httperr", "*/internal/core/httperr"]
    custom:
      # STY-3: a literal must set every field tagged required. Fields are optional unless tagged.
      requiredtag:
        type: module
        description: Struct literals set every field a struct tag marks required (STY-3)
        original-url: ./requiredtag
        settings:
          tags: [validate:required, lint:required]
          allow-empty-returns: true # return T{}, err and return T{}, false
      # ERR-3: the returns wrapcheck skips, checked against wrapcheck's own ignore lists.
      wrapgaps:
        type: module
        description: Errors returned directly in a closure, or from a generic call, are wrapped (ERR-3)
        original-url: ./wrapgaps
        settings:
          extra-ignore-sigs: *wrap-ignore-sigs
          ignore-package-globs: *wrap-ignore-packages
      # The structural checks. Each is its own linter, so an exception names the one it silences:
      # //nolint:layers // reason. They take no settings: the module, the layer and each SDK's home come from the code.
      layers:
        type: module
        description: 'Packages sit in a LAY-6 layer and import only what LAY-7 allows; each SDK has one home; Go lives in cmd, internal and pkg (LAY-1); test code stays in tests (TEST-13)'
        original-url: ./analyzers
      cmdshape:
        type: module
        description: 'main.go holds only main and run (LAY-2); each service has one wire function in wire.go (LAY-3)'
        original-url: ./analyzers
      names:
        type: module
        description: 'Banned package, file and type names, getters, constructors and error variables (LAY-9, LAY-10, ABS-3, ABS-6, STY-2)'
        original-url: ./analyzers
      enums:
        type: module
        description: 'enumx enums have a nil fallback, Parse, Validate, Oneof and UPPER_SNAKE variants (DOM-6)'
        original-url: ./analyzers
      services:
        type: module
        description: 'A core Service is built only by New(Deps) (*Service, error), with no exported fields or With methods (ABS-5)'
        original-url: ./analyzers
      adapters:
        type: module
        description: 'Adapters are built by New(cfg) (*T, error) and leak no SDK type (ABS-7)'
        original-url: ./analyzers
      generics:
        type: module
        description: 'No type switch on a type parameter (ABS-8)'
        original-url: ./analyzers
      errkinds:
        type: module
        description: 'Every errx.Kind is declared once, in foundation/errkinds, as ErrKind<Name> = "snake_case" (ERR-5)'
        original-url: ./analyzers
      gofihandlers:
        type: module
        description: 'Handlers follow gofi GUIDELINES.md: names, one per file, field order, schema placement, route info (HTTP-1, HTTP-2, HTTP-5)'
        original-url: ./analyzers
      errmap:
        type: module
        description: 'A handler returns its errors through httperr (ERR-7)'
        original-url: ./analyzers
      jobs:
        type: module
        description: 'Job handlers are named for their action and never inspect an error; job kinds are capability.action (JOB-1, ERR-8)'
        original-url: ./analyzers
      ctxkeys:
        type: module
        description: 'context.WithValue only in context.go, with unexported struct{} keys (CTX-2)'
        original-url: ./analyzers
      goroutines:
        type: module
        description: 'go statements only in foundation/supervise and pkg (CON-1, CON-2)'
        original-url: ./analyzers
      repos:
        type: module
        description: 'One package per aggregate with repo.go and row.go, exporting only Repo, with no SDK types in its methods (DATA-1, DATA-2)'
        original-url: ./analyzers
      repoverbs:
        type: module
        description: 'Repository methods use the standard verbs and do not repeat the package name (DATA-3)'
        original-url: ./analyzers
      constquery:
        type: module
        description: 'Repository statements are constants; no database clock; ON CONFLICT names its target (DATA-5, DATA-6, DATA-8, SEC-15)'
        original-url: ./analyzers
      comments:
        type: module
        description: 'Comments use ASCII punctuation, refer to no plans or steps, and give every TODO a ticket (STY-5)'
        original-url: ./analyzers
      metricnames:
        type: module
        description: 'Instruments are named <svc>.<capability>.<noun> with a unit (OBS-2)'
        original-url: ./analyzers
    funcorder: {constructor: true, struct-method: true, alphabetical: false}
    embeddedstructfieldcheck: {forbid-mutex: true} # ABS-9
    modernize:
      disable: [omitzero] # gofi's encoder honours only omitempty
    tagliatelle:
      case: {rules: {json: snake}}
    nolintlint: {require-explanation: true, require-specific: true}
    errorlint: {errorf: false, asserts: true, comparison: true} # ERR-6
    nilnil: {detect-opposite: true}
    iface: {enable: [identical, unused, opaque]} # ABS-1
    interfacebloat: {max: 7} # ABS-1
    ireturn: {allow: [anon, error, empty, stdlib, generic, 'github\.com/michaelolof/gofi\.']} # ABS-2; gofi's own interfaces, such as gofi.Router
    gosec:
      includes: [G201, G202, G402, G404, G115] # SQL concat (DATA-5), TLS, weak rand, int overflow

    forbidigo:
      analyze-types: true
      # Each msg starts with a [tag]; path exceptions in exclusions.rules match on the tag.
      forbid:
        - {pattern: '^signal\.Notify$', msg: "[signal] use signal.NotifyContext (LAY-4)"}
        - {pattern: '^os\.(Getenv|LookupEnv|Environ|Setenv)$', msg: "[env] read config via internal/config (LAY-12)"}
        - {pattern: '^time\.Now$', msg: "[clock] inject clock.Clock or pass now (DOM-3)"}
        - {pattern: '^context\.(Background|TODO)$', msg: "[ctx] accept ctx from the caller (CTX-4)"}
        - {pattern: '^time\.Sleep$', msg: "[sleep] select on a timer and ctx.Done() (CON-2)"}
        - {pattern: '^testing\.Short$', msg: "[short] use the integration build tag (TEST-2)"}
        - {pattern: '^(fmt\.Errorf|errors\.New)$', msg: "[errs] create errors with errx (ERR-12)"}
        - pattern: '^errx\.(Wrapf|WrapKindf|Is|As|Join|Unwrap|Contains|Must|Panic|UseLogger|ParseStampedError)$'
          pkg: '^github\.com/michaelolof/errx$'
          msg: "[errx] see ERR-2 for what to use instead"
        - {pattern: '^panic$', msg: "[panic] return an error (ERR-11)"}
        - {pattern: '^recover$', msg: "[recover] recover only at a root: the outermost middleware, the job dispatcher or goSafe, with //nolint:forbidigo and the reason (ERR-11)"}
        - {pattern: '^ulid\.(Make|New|MustNew)$', pkg: '^github\.com/oklog/ulid(/v2)?$', msg: "[ids] new IDs come from the injected ids.Generator (DOM-1, TEST-12)"}
        - {pattern: '^uuid\.(New|NewString|NewRandom|NewV7|Must)$', pkg: '^github\.com/google/uuid$', msg: "[ids] new IDs come from the injected ids.Generator (DOM-1, TEST-12)"}
        - {pattern: '^gocql\.(TimeUUID|RandomUUID)$', pkg: '^github\.com/gocql/gocql$', msg: "[ids] new IDs come from the injected ids.Generator (DOM-1, TEST-12)"}
        - {pattern: '\.UseIssueAsMsg$', msg: "[httperr-issue] only httperr.Map sends an error's own message to a client (ERR-7)"}
        - {pattern: '^logger\.(Infof|Warnf|Errorf|InfoT|WarnT|ErrorT|Wrapf?|WrapErrorf?)$', msg: "[logger] legacy logger API (LOG-1)"}
        - {pattern: '^slog\.(Debug|Info|Warn|Error|Log|LogAttrs)(Context)?$', msg: "[slog] log through internal/foundation/logger: logger.Info(stamp, ctx, event, ...) (LOG-1)"}
        - {pattern: '^slog\.(New|Default|SetDefault)$', msg: "[slog] the process logger is set up once by logger.Initialize (LOG-1)"}
        - pattern: '^gofi\.(GofiStore|ReadOnlyStore)\.(Get|Set|Has|TryGet|All)$'
          pkg: '^github\.com/michaelolof/gofi$'
          msg: "[gofi-store] use gofi.StoreGet/StoreSet with a typed key (CTX-3)"
        - {pattern: '\.(BeginTx|BeginTxFunc|StartSession|WithTransaction)$', msg: "[tx] transactions live inside repository methods or internal/adapters/*store (DATA-4)"}
        - {pattern: '\.PageState$', msg: "[cursor] use the pagination cursor codec (DATA-9)"}
        - {pattern: '^fmt\.(Appendf|Sprintf)$', msg: "[httperr-fmt] encode error bodies with encoding/json (ERR-7)"}

    depguard: # LAY-7, ABS-7, OBS-1, TEST-4
      rules:
        sdk-confinement:
          list-mode: lax
          files: ["$all", "!**/internal/adapters/**", "!**/internal/repository/**", "!**/cmd/**", "!**/*test/**", "!**/pkg/**"]
          deny:
            - {pkg: github.com/jackc/pgx, desc: drivers live in adapters/repository}
            - {pkg: go.mongodb.org/mongo-driver, desc: drivers live in adapters/repository}
            - {pkg: github.com/gocql/gocql, desc: drivers live in adapters/repository}
            - {pkg: github.com/redis/go-redis, desc: drivers live in adapters}
            - {pkg: github.com/twmb/franz-go, desc: drivers live in adapters}
            - {pkg: github.com/hibiken/asynq, desc: drivers live in adapters}
            - {pkg: github.com/aws/aws-sdk-go-v2, desc: SDKs live in adapters}
            - {pkg: github.com/minio/minio-go, desc: SDKs live in adapters}
            - {pkg: github.com/aws/smithy-go, desc: SDKs live in adapters}
            - {pkg: github.com/apache/cassandra-gocql-driver, desc: drivers live in adapters/repository}
        http-confinement:
          list-mode: lax
          files: ["$all", "!**/internal/http/**", "!**/cmd/**"]
          deny:
            # `$` = exact match; a bare prefix would also hit gofi-proxy-mocker.
            - {pkg: 'github.com/michaelolof/gofi$', desc: transport only}
            - {pkg: github.com/michaelolof/gofi/, desc: transport only}
            - {pkg: github.com/valyala/fasthttp, desc: transport only}
        pkg-isolation: # LAY-1: pkg/ libraries are extraction-ready
          list-mode: lax
          files: ["**/pkg/**"]
          deny:
            - {pkg: MODULE/internal, desc: pkg/ libraries must not import internal/}
        config-confinement:
          list-mode: lax
          files: ["$all", "!**/cmd/**", "!**/internal/config/**"]
          deny:
            - {pkg: MODULE/internal/config, desc: parse in cmd and pass values down}
        otel-confinement:
          list-mode: lax
          files: ["$all", "!**/internal/foundation/telemetry/**", "!**/cmd/**"]
          deny:
            - {pkg: go.opentelemetry.io/otel/sdk, desc: setup lives in foundation/telemetry}
            - {pkg: go.opentelemetry.io/otel/exporters, desc: setup lives in foundation/telemetry}
        otel-core: # OBS-1: core uses only the OTel API; instrumentation lives at the edges
          list-mode: lax
          files: ["**/internal/core/**"]
          deny:
            - {pkg: go.opentelemetry.io/contrib, desc: contrib instrumentation lives in adapters and http middleware}
            - {pkg: go.opentelemetry.io/otel/propagation, desc: propagation lives in http middleware and the job runtime}
        test-libraries:
          list-mode: lax
          files: ["$all"]
          deny:
            - {pkg: github.com/stretchr/testify/suite, desc: plain table tests}
            - {pkg: github.com/stretchr/testify/mock, desc: hand-written fakes}
            - {pkg: github.com/google/go-cmp, desc: testify require}
            - {pkg: github.com/golang/mock, desc: hand-written fakes}
            - {pkg: go.uber.org/mock, desc: hand-written fakes}
            - {pkg: github.com/testcontainers/testcontainers-go, desc: compose-based test infra}
        godotenv-tests-only:
          list-mode: lax
          files: ["$all", "!$test", "!**/*test/**"]
          deny:
            - {pkg: github.com/joho/godotenv, desc: only tests load .env}

    testifylint: {enable-all: true}
    thelper:
      test: {first: true, name: true, begin: true}
      tb: {first: true, name: true, begin: true}
    testpackage: {skip-regexp: '(export|internal)_test\.go'}

  exclusions:
    generated: strict
    warn-unused: false # one shared file; some rules are idle in some repos
    paths:
      - '(^|/)(testutil|testutils|testdata)/' # test helpers, paused with the tests (TEST-14)
      - '^test/' # black-box suites (TEST-1)
    rules:
      - path: '_test\.go'
        linters: [gocognit, wrapcheck, musttag, gosec, ireturn, containedctx, errname, requiredtag]
      - path: '_test\.go'
        linters: [revive]
        text: '^(exported|argument-limit|function-result-limit|max-control-nesting):'
      - {path: '_test\.go', linters: [forbidigo], text: '\[(errs|ctx|sleep|panic|recover|ids)\]'}
      - {path: '^internal/(foundation/ids|adapters)/', linters: [forbidigo], text: '\[ids\]'} # DOM-1: the generator, and a store adapter's own
      - {path: '/httperr/', linters: [forbidigo], text: '\[httperr-issue\]'}
      - {path: '^(cmd|internal/config)/', linters: [forbidigo], text: '\[env\]'}
      - {path: '^cmd/', linters: [forbidigo], text: '\[ctx\]'}
      - {path-except: '(^internal/(domain|core)/|(^|/)[a-z]*test/)', linters: [forbidigo], text: '\[clock\]'}
      - {path: '^internal/(repository|adapters/[a-z]+store)/', linters: [forbidigo], text: '\[tx\]'} # DATA-4
      - {path-except: '^internal/(http|core)/', linters: [forbidigo], text: '\[cursor\]'}
      - {path-except: '/httperr/', linters: [forbidigo], text: '\[httperr-fmt\]'}
      # ERR-7: httperr's constructors return *httperr, so WithMsg and WithSubject chain without an interface.
      - {path: '/httperr/', linters: [revive], text: '^unexported-return:'}
      # LAY-1: pkg/ libraries follow Go conventions, not the ones here (errx, the logger package, wrapcheck stamps).
      - {path: '^pkg/', linters: [forbidigo], text: '\[(errs|errx|logger|ctx|recover|ids)\]'}
      # LOG-1: only the logger package and main touch slog; the logger's own functions take the stamp before ctx.
      - {path: '^(internal/foundation/logger|cmd)/', linters: [forbidigo], text: '\[slog\]'}
      - {path: '^internal/foundation/logger/', linters: [revive], text: 'context-as-argument'}
      - {path: '^pkg/', linters: [wrapcheck, wrapgaps]}
      # ERR-7: the error body's __sid field is a fixed name, not snake_case.
      - {linters: [tagliatelle], text: "got '__sid'"}
      # ABS-1, JOB-1: ports/, foundation/ and jobs/ hold interfaces other packages use, so nothing in their own package does.
      - {path: '^internal/(ports|foundation|jobs)/', linters: [iface], text: '^unused:'}
      # ABS-1, ABS-2: gofi's Deps has one accessor per dependency, returning interfaces (gofi DEP-1, DEP-2).
      - {path: '^internal/http/deps/', linters: [interfacebloat, ireturn]}
      # STY-4: header names are lowercase kebab-case (gofi TAG-2). tagliatelle can't tell a header struct apart, so any such name passes.
      - {linters: [tagliatelle], text: "json\\(snake\\): got '[a-z0-9]+(-[a-z0-9]+)+' want"}

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt # strict superset of gofmt (STY-1)
    - gci # std | third-party | this module
  settings:
    gofumpt:
      extra: {group-params: true, clothe-returns: true}
    gci:
      sections: [standard, default, localmodule] # localmodule reads go.mod: no per-repo prefix
  exclusions:
    generated: strict
